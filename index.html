    <script>
      // Aplica o tema salvo antes do primeiro paint para evitar o flash de tema claro
      // em visitantes que usam o modo escuro (o ThemeContext só roda após a hidratação).
      try {
        if (localStorage.getItem('theme') === 'dark') {
          document.documentElement.classList.add('dark')
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
